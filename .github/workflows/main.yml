name: Staging Test and Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - id: staging-ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSHE_SSH_KEY }}

      - name: Deploy to Staging
        run: |
          ssh ${{ steps.staging-ssh.outputs.SERVER }} \
            bash /app/y_tateyama/deploy.sh y_tateyama

  test-staging:
    name: Test on Staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - id: staging-ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSHE_SSH_KEY }}

      - name: Run Cypress tests
        run: |
          ssh ${{ steps.staging-ssh.outputs.SERVER }} \
            'cd /ci && npx cypress run \
            --browser chrome \
            --spec "cypress/e2e/y_tateyama.cy.js,cypress/e2e/y_tateyama-detail.cy.js,cypress/e2e/y_tateyama-required.cy.js" \
            --config trashAssetsBeforeRuns=false'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test-staging

    steps:
      - id: production-ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to Production
        run: |
          ssh ${{ steps.production-ssh.outputs.SERVER }} \
            bash /app/y_tateyama/deploy.sh y_tateyama
